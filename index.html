<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kite Five</title>
<meta name="description" content="A push-your-luck kite game for 2 to 6 players, with robots, one-phone play, and linked phones.">
<meta name="theme-color" content="#EAF4FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A2B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kite Five">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EAF4FD; --surface:#FFFFFF; --ink:#13243A; --muted:#4D5E73; --line:#CFE0F0; --soft:#DCEBF8;
  --accent:#1D5FA8; --accent-ink:#FFFFFF; --good:#1F7A44; --good-ink:#FFFFFF; --bad:#B42318; --focus:#7C3AED; --warn:#8A5300;
  --k0:#C8233A; --k1:#D24E12; --k2:#F2C230; --k3:#1F8048; --k4:#1E63B0; --kink:#FFFFFF; --kink2:#1B1B1B;
  --font-display: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2B; --surface:#16263B; --ink:#EEF4FB; --muted:#A9BBD0; --line:#2B4260; --soft:#1D3150;
    --accent:#7FB6F2; --accent-ink:#0B1626; --good:#4ADE80; --good-ink:#0B1A10; --bad:#FF8A80; --focus:#C4B5FD; --warn:#FBBF24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2B; --surface:#16263B; --ink:#EEF4FB; --muted:#A9BBD0; --line:#2B4260; --soft:#1D3150;
  --accent:#7FB6F2; --accent-ink:#0B1626; --good:#4ADE80; --good-ink:#0B1A10; --bad:#FF8A80; --focus:#C4B5FD; --warn:#FBBF24;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:0 max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
h1{font-size:2.6rem;font-weight:800} h2{font-size:1.35rem;font-weight:800} h3{font-size:1.05rem}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px} [tabindex="-1"]:focus{outline:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px}
.meta{font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.btn{font:inherit;font-weight:700;font-size:1.02rem;border-radius:14px;padding:13px 14px;cursor:pointer;width:100%;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-good{background:var(--good);color:var(--good-ink);border-color:var(--good)}
.btn-big{font-size:1.2rem;padding:16px 14px}
.btn-small{width:auto;padding:7px 12px;font-size:.9rem;border-radius:999px}
.btn .sub{display:block;font-weight:500;font-size:.85rem;opacity:.9}
.btn.suggest{box-shadow:0 0 0 3px var(--focus)}
.btn.suggest::after{content:" (hint)";font-weight:600;font-size:.85rem}
.linkbtn{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{font:inherit;font-weight:700;font-size:.9rem;padding:9px 4px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
label{font-weight:700;font-size:.92rem}
input[type=text],select,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:84px;font-size:.85rem;word-break:break-all}
.seat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.xbtn{font:inherit;font-weight:700;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.hero{padding:16px 0 2px;display:flex;flex-direction:column;gap:8px}
.hero .tagline{color:var(--accent);font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.8rem}
.hero svg.sky{width:100%;height:auto;max-height:150px}
/* kite cards */
.kc{position:relative;display:inline-grid;place-items:center;width:46px;height:62px;border-radius:9px;color:var(--kink);font-family:var(--font-display);font-weight:900;font-size:1.45rem;border:2px solid rgba(0,0,0,.18);flex:none;line-height:1}
.kc .sh{position:absolute;top:3px;left:4px;width:13px;height:13px}
.kc .sh path,.kc .sh polygon,.kc .sh circle,.kc .sh rect{fill:currentColor}
.kc.c0{background:var(--k0)} .kc.c1{background:var(--k1)} .kc.c2{background:var(--k2);color:var(--kink2)} .kc.c3{background:var(--k3)} .kc.c4{background:var(--k4)}
.kc.c5{background:linear-gradient(160deg,var(--k0),var(--k1) 25%,var(--k2) 45%,var(--k3) 65%,var(--k4));text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 1px #000}
.kc.big{width:86px;height:116px;border-radius:14px;font-size:2.8rem}
.kc.big .sh{width:22px;height:22px;top:6px;left:7px}
.kc .nm{position:absolute;bottom:5px;font-size:.62rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.kc.big .nm{font-size:.75rem;bottom:8px}
.kc.pick{cursor:pointer}
.cards{display:flex;flex-wrap:wrap;gap:5px;min-height:62px;align-items:center}
.none{color:var(--muted);font-size:.88rem}
.die{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:14px;background:var(--surface);border:3px solid var(--ink);font-family:var(--font-display);font-weight:900;font-size:2.2rem;flex:none}
/* table */
.seats{display:flex;flex-direction:column;gap:8px}
.pl{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.pl.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pl .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pl .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-weight:700;white-space:nowrap;font-size:.92rem}
.tagx{font-size:.72rem;font-weight:800;border:1.5px solid currentColor;border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted);vertical-align:2px}
.tagx.turn{color:var(--accent)} .tagx.off{color:var(--bad)}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.news{display:flex;gap:12px;align-items:center;min-height:70px}
.news p{font-weight:600}
.news.tangle p{color:var(--bad)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.choose{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.coach{border:2px solid var(--focus);background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.coach .who{font-weight:800;color:var(--focus);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.hint{border-left:4px solid var(--focus);padding:8px 10px;background:var(--soft);border-radius:8px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.7rem;font-weight:800;letter-spacing:.08em;text-align:center;padding:12px;background:var(--soft);border-radius:12px}
.checkc{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px;text-align:center}
.banner .big{font-family:var(--font-display);font-size:1.7rem;font-weight:800}
.warn{color:var(--warn);font-weight:700}
.reslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reslist li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,500px);max-height:86vh}
dialog::backdrop{background:rgba(6,12,22,.6)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:86vh;overflow:auto}
.dlg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.status{font-weight:700}
.status.ok{color:var(--good)} .status.wait{color:var(--warn)}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><polygon points="16,2 27,13 16,26 5,13" fill="#1E63B0"/><polygon points="16,2 27,13 16,13" fill="#C8233A"/><polygon points="16,13 5,13 16,26" fill="#F2C230"/><path d="M16 26 C 13 28, 19 29, 15 31" stroke="#1F8048" stroke-width="2" fill="none"/></svg><span>Kite Five</span></div>
    <div class="meta" id="meta"></div>
    <button class="btn btn-small" id="menuBtn" type="button">Menu</button>
  </header>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
  <main id="view" class="stack"></main>
  <dialog id="dlg" aria-label="Menu"><div class="dlg" id="dlgBody"></div></dialog>
</div>

<script>
// Kite Five: the rules, independent of the screens. Every random event comes from a seeded generator kept in the
// game state, so two phones that start from the same code and see the same moves always agree.
const KF = (() => {
  const VERSION = 1;
  const COLORS = [
    { key: 'red', name: 'Red', shape: 'diamond', sym: '◆' },
    { key: 'orange', name: 'Orange', shape: 'triangle', sym: '▲' },
    { key: 'yellow', name: 'Yellow', shape: 'circle', sym: '●' },
    { key: 'green', name: 'Green', shape: 'square', sym: '■' },
    { key: 'blue', name: 'Blue', shape: 'hexagon', sym: '⬢' },
    { key: 'rainbow', name: 'Rainbow', shape: 'star', sym: '✦', wild: true }
  ];
  const RAINBOW = 5;
  // deck: each of the 5 colors has two 0s and three each of 1 to 6; plus 6 rainbow kites numbered 1 to 6
  const CARDS = [];
  for (let c = 0; c < 5; c++) { CARDS.push({ c, n: 0 }, { c, n: 0 }); for (let n = 1; n <= 6; n++) for (let k = 0; k < 3; k++) CARDS.push({ c, n }); }
  for (let n = 1; n <= 6; n++) CARDS.push({ c: RAINBOW, n });
  const REMOVE = { 2: 52, 3: 39, 4: 26, 5: 13, 6: 0 };
  const card = id => CARDS[id];
  const label = id => { const k = CARDS[id]; return `${COLORS[k.c].name} ${k.n}`; };

  // mulberry32, with its state stored in the game
  function next(g) { let t = (g.rng = (g.rng + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const randInt = (g, n) => Math.floor(next(g) * n);

  /* seats: [{ name, kind: 'human'|'robot', level: 1|2|3 }]; preset (practice game): { top: [card ids drawn first], rolls: [die results used first] } */
  function newGame(seats, seed, preset) {
    const g = { v: VERSION, seed: seed >>> 0, rng: seed >>> 0, players: seats.map(s => ({ name: s.name, kind: s.kind, level: s.level || 2, up: [], bank: [] })),
      deck: [], removed: 0, discard: [], turn: 0, phase: 'turn', final: false, queue: [], done: [], pend: null, lastDraw: false,
      moveNo: 0, log: [], rolls: preset && preset.rolls ? preset.rolls.slice() : [] };
    let ids = CARDS.map((_, i) => i);
    const top = preset && preset.top ? preset.top : [];
    ids = ids.filter(i => !top.includes(i));
    for (let i = ids.length - 1; i > 0; i--) { const j = randInt(g, i + 1); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const rm = REMOVE[seats.length] || 0;
    g.removed = rm; ids = ids.slice(rm);
    if (preset && preset.size) ids = ids.slice(0, Math.max(0, preset.size - top.length)); // short practice deck
    g.deck = ids.concat(top.slice().reverse()); // draw from the end, so top[0] comes first
    return g;
  }

  const colorsUp = p => new Set(p.up.map(id => CARDS[id].c).filter(c => c !== RAINBOW));
  const hasColor = (p, c) => c !== RAINBOW && p.up.some(id => CARDS[id].c === c);
  const score = p => p.bank.reduce((s, id) => s + CARDS[id].n, 0);
  const upValue = p => p.up.reduce((s, id) => s + CARDS[id].n, 0);
  const upNumbers = p => new Set(p.up.map(id => CARDS[id].n).filter(n => n >= 1));
  function ev(g, e) { e.no = g.moveNo; g.log.push(e); if (g.log.length > 60) g.log.shift(); }

  // a player with all five colors in the air reels them all in at once, even off-turn
  function checkFive(g, i) {
    const p = g.players[i];
    if (colorsUp(p).size === 5) { const cards = p.up.slice(); p.bank.push(...p.up); p.up = []; ev(g, { t: 'five', who: i, cards, pts: cards.reduce((s, id) => s + CARDS[id].n, 0) }); }
  }

  /* what has to happen next: { who, kind: 'turn'|'give'|'take', options } */
  function decision(g) {
    if (g.phase === 'over') return null;
    if (g.phase === 'turn') {
      const p = g.players[g.turn], opts = [];
      if (!g.final && g.deck.length) opts.push('draw');
      if (p.up.length) opts.push('bank');
      return { who: g.turn, kind: 'turn', options: opts };
    }
    if (g.phase === 'give') return { who: g.turn, kind: 'give', options: g.pend.to.slice(), card: g.pend.card };
    if (g.phase === 'take') return { who: g.pend.takers[0], kind: 'take', options: takeable(g, g.pend.takers[0]), from: g.pend.from };
    return null;
  }
  function takeable(g, i) {
    const p = g.players[i], from = g.players[g.pend.from];
    return from.up.filter(id => CARDS[id].c === RAINBOW || !hasColor(p, CARDS[id].c));
  }

  function apply(g, a) {
    const d = decision(g);
    if (!d) throw new Error('game over');
    g.moveNo++;
    if (d.kind === 'turn') {
      if (!d.options.includes(a.t)) throw new Error('not allowed: ' + a.t);
      if (a.t === 'draw') return draw(g);
      return bank(g);
    }
    if (d.kind === 'give') {
      if (a.t !== 'give' || !d.options.includes(a.to)) throw new Error('bad give');
      const id = g.pend.card; g.pend = null; g.phase = 'turn';
      g.players[a.to].up.push(id); ev(g, { t: 'give', who: g.turn, to: a.to, card: id });
      checkFive(g, a.to);
      return endTurn(g);
    }
    if (d.kind === 'take') {
      const taker = d.who;
      if (a.t !== 'take' || (a.card !== null && !d.options.includes(a.card))) throw new Error('bad take');
      g.pend.takers.shift();
      if (a.card !== null) {
        const from = g.players[g.pend.from];
        from.up.splice(from.up.indexOf(a.card), 1); g.players[taker].up.push(a.card);
        ev(g, { t: 'take', who: taker, from: g.pend.from, card: a.card }); checkFive(g, taker);
      } else ev(g, { t: 'pass', who: taker, from: g.pend.from });
      return continueTakes(g);
    }
  }

  function draw(g) {
    const id = g.deck.pop(), c = CARDS[id].c, me = g.players[g.turn];
    if (!g.deck.length) g.lastDraw = true;
    if (c === RAINBOW || !hasColor(me, c)) {
      me.up.push(id); ev(g, { t: 'keep', who: g.turn, card: id }); checkFive(g, g.turn); return endTurn(g);
    }
    const to = [];
    for (let k = 1; k < g.players.length; k++) { const i = (g.turn + k) % g.players.length; if (!hasColor(g.players[i], c)) to.push(i); }
    if (to.length) { g.phase = 'give'; g.pend = { card: id, to }; ev(g, { t: 'mustgive', who: g.turn, card: id, to }); return; }
    g.discard.push(id); ev(g, { t: 'tangle', who: g.turn, card: id, why: 'color' });
    return startTakes(g);
  }
  function bank(g) {
    const me = g.players[g.turn];
    const roll = g.rolls.length ? g.rolls.shift() : 1 + randInt(g, 6);
    if (upNumbers(me).has(roll)) { ev(g, { t: 'tangle', who: g.turn, roll, why: 'roll' }); return startTakes(g); }
    const cards = me.up.slice(); me.bank.push(...me.up); me.up = [];
    ev(g, { t: 'bank', who: g.turn, roll, cards, pts: cards.reduce((s, id) => s + CARDS[id].n, 0) });
    return endTurn(g);
  }
  function startTakes(g) {
    const n = g.players.length, takers = [];
    for (let k = 1; k < n; k++) { const i = (g.turn + k) % n; if (!(g.final && g.done.includes(i))) takers.push(i); }
    g.phase = 'take'; g.pend = { from: g.turn, takers };
    return continueTakes(g);
  }
  function continueTakes(g) {
    const from = g.players[g.pend.from];
    while (g.pend.takers.length && from.up.length) {
      if (takeable(g, g.pend.takers[0]).length) return; // that player decides
      ev(g, { t: 'cant', who: g.pend.takers[0], from: g.pend.from }); g.pend.takers.shift();
    }
    if (from.up.length) { ev(g, { t: 'drop', who: g.pend.from, cards: from.up.slice() }); g.discard.push(...from.up); from.up = []; }
    g.pend = null; g.phase = 'turn';
    return endTurn(g);
  }
  function endTurn(g) {
    const n = g.players.length;
    if (g.final) { g.done.push(g.turn); g.queue.shift(); }
    else if (g.lastDraw) {
      g.final = true; g.queue = []; for (let k = 1; k <= n; k++) g.queue.push((g.turn + k) % n);
      ev(g, { t: 'final' });
    } else { g.turn = (g.turn + 1) % n; return; }
    // last flight: skip anyone with nothing in the air
    while (g.queue.length && !g.players[g.queue[0]].up.length) { ev(g, { t: 'skip', who: g.queue[0] }); g.done.push(g.queue.shift()); }
    if (!g.queue.length) { g.phase = 'over'; ev(g, { t: 'over' }); return; }
    g.turn = g.queue[0];
  }

  function standings(g) {
    const rows = g.players.map((p, i) => ({ i, name: p.name, score: score(p), cards: p.bank.length }));
    rows.sort((a, b) => b.score - a.score || b.cards - a.cards);
    const top = rows[0];
    rows.forEach(r => { r.win = r.score === top.score && r.cards === top.cards; });
    return rows;
  }

  // short code so linked phones can confirm they show the same game
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  function check(g) {
    const s = JSON.stringify([g.players.map(p => [p.up, p.bank]), g.deck.length, g.turn, g.phase, g.rng, g.moveNo]);
    let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    let out = ''; for (let k = 0; k < 4; k++) { out += B32[h & 31]; h >>>= 5; } return out;
  }

  return { VERSION, COLORS, RAINBOW, CARDS, REMOVE, card, label, newGame, decision, apply, takeable, colorsUp, hasColor, score, upValue, upNumbers, standings, check, B32 };
})();
if (typeof module !== 'undefined') module.exports = KF;

// Kite Five robots and hints. Robots only use what is visible on the table, like a person would.
const KAI = (() => {
  const { CARDS, RAINBOW, COLORS } = KF;
  function rnd(g, salt) { // repeatable per move, so linked phones make the same robot choices
    let h = (g.seed ^ Math.imul(g.moveNo + 1, 0x9E3779B1) ^ Math.imul(salt + 7, 0x85EBCA6B)) >>> 0;

    if (d && d.kind === 'turn' && d.who === 0 && d.options.length === 2 && seen.give) cand.push(['choose', 'You have a kite in the air, so you can reel in now. You roll the die. If the roll matches a number on one of your flying kites, you tangle. Otherwise every flying kite becomes safe points. Tap Hint whenever you want advice.']);
    if (d && d.kind === 'turn' && d.who === 0 && d.options.length === 2 && !seen.give && seen.keep && g.moveNo <= 4) cand.push(['try', 'You could reel in now, but for practice, try launching one more kite to see what happens with a color you already fly.']);
    const eb = recent.find(e => e.t === 'bank'); if (eb) cand.push(['bank', `${g.players[eb.who].name} reeled in. Those kites are now safe for the rest of the game, and only reeled-in points count at the end.`]);
    const et = recent.find(e => e.t === 'tangle'); if (et) cand.push(['tangle', `${g.players[et.who].name} got tangled! Going around the table, each other player may grab one of those kites, but not a color they already fly. Whatever is left blows away.`]);
    if (d && d.kind === 'take' && d.who === 0) cand.push(['take', `You may grab one of ${g.players[d.from].name}'s kites. Colors you already fly aren't allowed, but rainbow kites always are. Each new number you take adds risk to your next reel-in.`]);
    const er = recent.find(e => e.t === 'keep' && KF.card(e.card).c === KF.RAINBOW); if (er) cand.push(['rainbow', 'A rainbow kite has no color, so whoever launches it always keeps it, even with another rainbow already flying.']);
    if (KF.colorsUp(me).size >= 3 || g.moveNo >= 16) cand.push(['five', 'If you ever fly all five colors at the same time, that is a Kite Five! All of your flying kites reel in at once with no roll, even on someone else\'s turn.']);
    if (recent.some(e => e.t === 'final')) cand.push(['final', 'The deck is empty, so this is the last flight. Everyone gets one more turn, and that turn must be a reel-in. Anyone who has already had a last turn can no longer grab kites.']);
    if (g.phase === 'over') cand.push(['over', 'That is the whole game. Reeled-in points win, and a tie goes to whoever reeled in more kites. Ready for a real game? Tap Home, then Set up a game.']);
    const pick = cand.find(([k]) => !seen[k]);
    return pick ? { key: pick[0], text: pick[1] } : null;
  }

  /* ---------- live link: host side ---------- */

  function hostState(seat, st) {

  function payload(seat) {

  }
  function sendTo(seat) { const c = conns[seat]; if (c && c.link && c.link.open()) c.link.send(payload(seat)); }
  function broadcast() { if (mode() !== 'host') return; Object.keys(conns).forEach(s => sendTo(Number(s))); }
  async function makeInvite(seat) {
    const old = conns[seat]; if (old && old.inv) { try { old.inv.pc.close(); } catch (e) { /* ignore */ } }
    conns[seat] = { status: 'making' }; render();
    try {
      const inv = await NET.invite({ s: seat, g: S.meta.gid }, m => hostMsg(seat, m), st => hostState(seat, st));
      conns[seat] = { inv, link: inv.link, status: 'invited', url: location.href.split('#')[0] + '#join=' + inv.code };
    } catch (e) { conns[seat] = { status: 'error', err: 'Could not make an invite on this phone.' }; }
    render();
  }
  async function acceptReply(seat, text) {

  }
  function inviteBlock(seat) {

    let inner = '';
    if (c.status === 'invited' || c.status === 'connecting' || (c.status === 'off' && c.url)) {

  /* ---------- live link: guest side ---------- */

  }

  /* ---------- the game table ---------- */
  function gameScreen() {
    const g = S.game, d = KF.decision(g), m = mode();
    meta.textContent = g.phase === 'over' ? 'Game over' : g.final ? 'Last flight' : `Deck: ${g.deck.length}`;
    if (g.phase === 'over') return overScreen(g);
    const coach = coachPick(g);
    if (coach) S.meta.coachNow = coach.key;
    const who = g.players[d.who], mineNow = iControl(d.who);
    const lastNo = g.log.length ? g.log[g.log.length - 1].no : -1;
    const news = g.log.filter(e => e.no === lastNo && e.t !== 'cant');
    const prev = []; for (let i = g.log.length - 1; i >= 0 && prev.length < 5; i--) if (g.log[i].no !== lastNo) prev.push(g.log[i]);
    const showCard = [...news].reverse().find(e => e.card !== undefined && ['keep', 'mustgive', 'give', 'tangle', 'take'].includes(e.t));
    const showRoll = news.find(e => e.roll);
    const tangled = news.some(e => e.t === 'tangle');
    const visual = (showCard ? kc(showCard.card, true) : '') + (showRoll ? `<span class="die" role="img" aria-label="Die showing ${showRoll.roll}">${showRoll.roll}</span>` : '');
    const isYou = who.name === 'You' || (m === 'guest' && S.meta.mine.includes(d.who));
    const status = d.kind === 'turn' ? (g.final ? `Last flight: ${esc(who.name)} must reel in` : isYou ? 'Your turn' : `${esc(who.name)}'s turn`)
      : d.kind === 'give' ? `${esc(who.name)} ${isYou ? 'give' : 'gives'} a kite away` : `${esc(who.name)} may grab a kite from ${esc(g.players[d.from].name)}`;
    let acts = '';
    if (mineNow) acts = actions(g, d);
    else if (who.kind === 'robot') acts = `<p class="muted">${esc(who.name)} is thinking…</p>`;
    else acts = `<p class="muted">Waiting for ${esc(who.name)}${m === 'host' && conns[d.who] && conns[d.who].status !== 'on' ? ', whose phone is not connected. Open the menu and tap Reconnect players.' : '…'}</p>`;
    const check = m === 'mirror' ? `<p class="small muted">Check code <span class="checkc">${KF.check(g)}</span>. It should match on every phone.</p>` : '';
    const offline = m === 'guest' && guest && guest.status === 'closed' ? '<p class="warn" role="alert">The connection to the host was lost. Ask the host for a new invite link.</p>' : '';
    return `${offline}${coach ? `<div class="coach" role="note"><span class="who">Coach</span><p>${esc(coach.text)}</p><button type="button" class="btn btn-small" data-act="coachok">Got it</button></div>` : ''}
      <section class="stage" aria-label="Current turn"><h2 tabindex="-1" id="turnH">${status}</h2>
        <div class="news${tangled ? ' tangle' : ''}">${visual}<p>${news.length ? esc(news.map(e => line(e, g)).join(' ')) : 'Nobody has launched a kite yet.'}</p></div>

  }
  function seatPanel(g, i, d) {
    const p = g.players[i], on = d && d.who === i, m = mode();

    const nums = [...KF.upNumbers(p)].sort();

      <div class="cards" aria-label="${esc(p.name)}'s kites in the air">${p.up.length ? p.up.map(id => kc(id)).join('') : '<span class="none">No kites in the air</span>'}</div>
      ${p.up.length ? `<p class="small muted">In the air: ${plural(KF.upValue(p), 'point')}. ${nums.length ? `A roll of ${orList(nums.map(String))} tangles.` : 'No roll can tangle these.'}</p>` : ''}</div>`;
  }
  function actions(g, d) {
    const h = hintOn && hintOn.no === g.moveNo ? hintOn : null;
    const sug = a => h && JSON.stringify(h.act) === JSON.stringify(a) ? ' suggest' : '';
    const tools = `<div class="row">${undo.length && ['pass', 'mirror', 'practice'].includes(mode()) ? '<button type="button" class="linkbtn" data-act="undo">Undo</button>' : ''}<button type="button" class="linkbtn" data-act="hint">Hint</button></div>${h ? `<p class="hint" role="note">${esc(h.text)}</p>` : ''}`;
    const me = g.players[d.who];
    if (d.kind === 'turn') {
      const nums = [...KF.upNumbers(me)].sort();
      return `<div class="stack">${d.options.includes('draw') ? `<button type="button" class="btn btn-primary btn-big${sug({ t: 'draw' })}" data-act="move" data-v="draw">Launch a kite<span class="sub">Draw from the deck (${g.deck.length} left)</span></button>` : ''}
        ${d.options.includes('bank') ? `<button type="button" class="btn btn-good btn-big${sug({ t: 'bank' })}" data-act="move" data-v="bank">Reel in<span class="sub">Roll the die to bank ${plural(KF.upValue(me), 'point')}. ${nums.length ? `Tangles on ${orList(nums.map(String))}.` : 'Safe on any roll.'}</span></button>` : ''}
        ${tools}</div>`;
    }
    if (d.kind === 'give') return `<p><b>Give the ${label(d.card)} to:</b></p><div class="choose">${d.options.map(j => `<button type="button" class="btn${sug({ t: 'give', to: j })}" data-act="give" data-i="${j}">${esc(g.players[j].name)}</button>`).join('')}</div>${tools}`;
    if (d.kind === 'take') return `<p><b>${me.name === 'You' ? 'Grab' : esc(me.name) + ', grab'} one of ${esc(g.players[d.from].name)}'s kites?</b></p>
      <div class="choose">${d.options.map(id => `<button type="button" class="btn${sug({ t: 'take', card: id })}" data-act="take" data-i="${id}" aria-label="Take the ${label(id)}"><span class="row" style="align-items:center;flex-wrap:nowrap;justify-content:center">${kc(id)}<span>${label(id)}</span></span></button>`).join('')}</div>
      <button type="button" class="btn${sug({ t: 'take', card: null })}" data-act="take" data-i="none">Take nothing</button>${tools}`;
    return '';
  }
  function overScreen(g) {
    const rows = KF.standings(g), wins = rows.filter(r => r.win).map(r => r.name), coach = coachPick(g);
    const canAgain = mode() !== 'guest';
    return `${coach ? `<div class="coach" role="note"><span class="who">Coach</span><p>${esc(coach.text)}</p><button type="button" class="btn btn-small" data-act="coachok">Got it</button></div>` : ''}
      <div class="banner"><p>Game over</p><h2 class="big" tabindex="-1">${wins.length > 1 ? `Shared win: ${esc(andList(wins))}!` : `${esc(wins[0])} wins!`}</h2></div>
      <ol class="reslist">${rows.map(r => `<li><span>${esc(r.name)}</span><span>${plural(r.score, 'point')} (${plural(r.cards, 'kite')})</span></li>`).join('')}</ol>
      ${canAgain && mode() !== 'practice' ? '<button type="button" class="btn btn-primary btn-big" data-act="again">Play again, same seats</button>' : ''}
      <button type="button" class="btn" data-act="leave">Home</button>`;
  }

  /* ---------- page drawing ---------- */
  let lastKey = '', botTimer = null;
  function render() {
    const scr = S.screen;
    const key = scr + (scr === 'game' && S.game ? ':' + S.game.phase : '');
    const ae = document.activeElement, keep = ae && view.contains(ae) && ae.id ? ae.id : null;
    let html = '';
    if (scr === 'setup') html = setupScreen();
    else if (scr === 'mirrorcode') html = mirrorCodeScreen();
    else if (scr === 'join') html = joinScreen();
    else if (scr === 'lobby') html = lobbyScreen();
    else if (scr === 'guestjoin') html = guestJoinScreen();
    else if (scr === 'guestwait') html = guestWaitScreen();
    else if (scr === 'game' && S.game) { html = gameScreen(); }
    else { S.screen = 'home'; html = home(); }
    view.innerHTML = html;
    if (key !== lastKey) { window.scrollTo(0, 0); const h = view.querySelector('h1,h2'); if (h && lastKey) h.focus({ preventScroll: true }); }
    else if (keep) { const el = document.getElementById(keep); if (el) el.focus({ preventScroll: true }); }
    lastKey = key;
    if (scr === 'game' && S.game) { announce(S.game); scheduleBot(); }
  }
  function scheduleBot() {
    clearTimeout(botTimer);
    const g = S.game; if (!g || g.phase === 'over' || !runsRobots() || S.screen !== 'game') return;
    const d = KF.decision(g); if (g.players[d.who].kind !== 'robot') return;
    const wait = ({ fast: 0.45, test: 0.02 }[S.prefs.pace] || 1) * (d.kind === 'turn' ? 1500 : 1000);
    botTimer = setTimeout(() => {
      if (S.game !== g) return; const d2 = KF.decision(g);
      if (d2 && g.players[d2.who].kind === 'robot') doAct(KAI.decide(g), true);
    }, wait);
  }
  function doAct(a, auto) {
    const g = S.game; if (!g) return;
    if (mode() === 'guest') { if (guest && guest.api && guest.api.link) guest.api.link.send({ t: 'act', a, no: g.moveNo }); return; }
    if (!auto && ['pass', 'mirror', 'practice'].includes(mode())) snap();
    try { KF.apply(g, a); } catch (e) { if (!auto) undo.pop(); return; }
    hintOn = null; save(); broadcast(); render();
  }

  /* ---------- dialogs ---------- */
  function openDlg(html) {
    dlgBody.innerHTML = html;
    if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
    const h = dlgBody.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus(); }
  }
  function closeDlg() { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); } }
  const RULES = `<h2>How to play Kite Five</h2>
    <p>Score the most points by reeling in kites. Each card is a kite with a number from 0 to 6. There are five colors, each with its own shape (red diamond, orange triangle, yellow circle, green square, blue hexagon), plus rainbow kites with a star.</p>
    <h3>On your turn, do one thing</h3><ul>
      <li><b>Launch a kite.</b> Draw a card. If you have no kite of that color flying, keep it in the air. If you already fly that color, give it to any player who doesn't. If every player already flies that color, you are tangled.</li>
      <li><b>Reel in.</b> Roll the die. If the roll matches the number on any kite you have flying, you are tangled. Otherwise every flying kite moves to your reeled-in pile, safe for the rest of the game.</li></ul>
    <h3>Rainbow kites</h3><p>They have no color, so you always keep them, even with another rainbow flying.</p>
    <h3>Tangled</h3><p>Going around the table from the tangled player, each other player may grab one of their flying kites, but not a color they already fly. Whatever is left blows away.</p>
    <h3>Kite Five</h3><p>If you ever fly all five colors at once, all of your flying kites reel in at once, with no roll, even on someone else's turn.</p>
    <h3>Last flight</h3><p>When the last card is drawn, everyone gets one final turn, and it must be a reel-in. Once you have had your last turn, you can't grab kites from anyone else.</p>
    <h3>Winning</h3><p>Add up the numbers on your reeled-in kites. Highest total wins. A tie goes to whoever reeled in more kites. Still tied? You share the win.</p>
    <h3>Deck size</h3><p>Fewer players use a smaller deck: the app sets aside 52 cards for 2 players, 39 for 3, 26 for 4, 13 for 5, and none for 6, at random.</p>
    <h3>Playing on several phones</h3><ul><li><b>Mirror phones:</b> every phone uses the same game code, so the deck and dice match. Say your move out loud and everyone taps it. The check code confirms the phones agree.</li>
      <li><b>Live link:</b> the host invites each person with a link, they send back a reply code, and moves appear on every phone by themselves.</li></ul>
    <button type="button" class="btn btn-primary" data-act="close">Got it</button>`;
  function menu() {
    const m = mode(), inGame = S.screen === 'game' && S.game;
    openDlg(`<h2>Menu</h2>
      <button type="button" class="btn" data-act="rules">How to play</button>
      ${m === 'host' && inGame ? '<button type="button" class="btn" data-act="reconnect">Reconnect players</button>' : ''}
      ${m === 'mirror' && S.meta && S.meta.code ? `<p>Game code <b class="checkc">${esc(S.meta.code)}</b></p>` : ''}
      <label class="check"><input type="checkbox" data-pref="sound"${S.prefs.sound ? ' checked' : ''}> Sounds</label>
      <label class="check"><input type="checkbox" data-pref="pace"${S.prefs.pace === 'fast' ? ' checked' : ''}> Fast robots</label>
      ${inGame ? '<button type="button" class="btn" data-act="quit">Leave this game</button>' : ''}
      <button type="button" class="btn btn-primary" data-act="close">Close</button>
      <p class="small muted center">Build b52e0ce4</p>`);
  }
  function reconnectDlg() {
    openDlg(`<h2>Reconnect players</h2><p class="small muted">Make a fresh invite for anyone whose phone dropped off, or play their turns here.</p>
      ${S.meta.where.map((k, i) => k === 'remote' ? inviteBlock(i) : '').join('') || '<p>No one is on another phone.</p>'}
      <button type="button" class="btn btn-primary" data-act="close">Done</button>`);
  }

  /* ---------- starting games ---------- */
  function newSeed() { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (e) { return Math.floor(Math.random() * 4294967296); } }
  function mkCode(seed, kinds) {
    let x = 1n; x = (x << 3n) | BigInt(kinds.length - 2);
    for (let i = 0; i < 6; i++) x = (x << 2n) | BigInt(kinds[i] || 0);
    x = (x << 32n) | BigInt(seed >>> 0);
    const ch = []; for (let i = 0; i < 10; i++) { ch.unshift(KF.B32[Number(x & 31n)]); x >>= 5n; }
    const sum = ch.reduce((s, c, i) => s + KF.B32.indexOf(c) * (i + 3), 0) % 32;
    const s = ch.join('') + KF.B32[sum]; return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8)}`;
  }
  function readCode(raw) {
    const s = String(raw).toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V').replace(/[^0-9A-Z]/g, '');
    if (s.length !== 11 || [...s].some(c => KF.B32.indexOf(c) < 0)) return { ok: false, raw, err: 'A game code has 11 letters and numbers, like 1A2B-3C4D-5E6.' };
    const sum = [...s.slice(0, 10)].reduce((t, c, i) => t + KF.B32.indexOf(c) * (i + 3), 0) % 32;
    if (KF.B32[sum] !== s[10]) return { ok: false, raw, err: 'That code has a typo somewhere. Check it with the host.' };
    let x = 0n; for (const c of s.slice(0, 10)) x = (x << 5n) | BigInt(KF.B32.indexOf(c));
    const seed = Number(x & 0xFFFFFFFFn); x >>= 32n;
    const k6 = []; for (let i = 5; i >= 0; i--) { k6[i] = Number(x & 3n); x >>= 2n; }
    const n = Number(x & 7n) + 2; x >>= 3n;
    if (x !== 1n || n > 6) return { ok: false, raw, err: 'That code is from a different version of the game.' };
    return { ok: true, raw, seed, kinds: k6.slice(0, n), names: [] };
  }
  function seatsFor(names, kinds) { return kinds.map((k, i) => k ? { name: ROBOTS[i], kind: 'robot', level: k } : { name: names[i], kind: 'human' }); }
  function startFromSetup() {
    const st = S.setup, names = seatNames(st.seats);
    undo = []; hintOn = null; lastSaid = -1;
    if (st.mode === 'live') {
      S.game = null;
      S.meta = { mode: 'host', where: st.seats.map(s => s.kind), names: st.seats.map((s, i) => s.kind === 'remote' ? '' : names[i]), levels: st.seats.map(s => s.level || 2), gid: newSeed().toString(36), seed: newSeed() };
      S.screen = 'lobby'; save(); render(); return;
    }
    const seed = newSeed(), kinds = st.seats.map(s => s.kind === 'robot' ? (s.level || 2) : 0);
    S.game = KF.newGame(seatsFor(names, kinds), seed);
    S.meta = { mode: st.mode, code: st.mode === 'mirror' ? mkCode(seed, kinds) : null, kinds, names };
    S.screen = st.mode === 'mirror' ? 'mirrorcode' : 'game';
    save(); render();
  }
  function hostStart() {
    const M = S.meta, seats = M.where.map((k, i) => k === 'robot' ? { name: ROBOTS[i], kind: 'robot', level: M.levels[i] } : { name: M.names[i] || `Player ${i + 1}`, kind: 'human' });
    S.game = KF.newGame(seats, M.seed); lastSaid = -1; S.screen = 'game'; save(); broadcast(); render();
  }
  function startPractice() {
    undo = []; hintOn = null; lastSaid = -1;
    S.game = KF.newGame([{ name: 'You', kind: 'human' }, { name: 'Breezy', kind: 'robot', level: 2 }, { name: 'Gusty', kind: 'robot', level: 2 }], PRACTICE.seed, PRACTICE.preset(cardId));
    S.meta = { mode: 'practice', coach: {} }; S.screen = 'game'; save(); render();
  }
  function leaveGame() {
    clearTimeout(botTimer);
    Object.keys(conns).forEach(k => { const c = conns[k]; try { c.inv && c.inv.pc.close(); } catch (e) { /* ignore */ } delete conns[k]; });
    if (guest && guest.api) { try { guest.api.pc.close(); } catch (e) { /* ignore */ } }
    guest = null; S.game = null; S.meta = null; undo = []; S.screen = 'home'; save(); render();
  }

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); say('Copied.'); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (err) { ok = false; } ta.remove(); say(ok ? 'Copied.' : 'Copy did not work. Press and hold to copy instead.'); return ok;
    }
  }
  async function shareText(title, text, url) {
    if (navigator.share) { try { await navigator.share(url ? { title, text, url } : { title, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyText(url ? `${text} ${url}` : text);
  }

  /* ---------- taps ---------- */
  async function act(a, el) {
    const d = el.dataset, g = S.game;
    switch (a) {
      case 'menu': menu(); return;
      case 'rules': openDlg(RULES); return;
      case 'close': closeDlg(); render(); return;
      case 'reconnect': reconnectDlg(); return;
      case 'quit': openDlg(`<h2>Leave this game?</h2><p>${mode() === 'host' ? 'The game ends for everyone connected.' : 'You can start a new one any time.'}</p>
          <button type="button" class="btn btn-primary" data-act="quityes">Yes, leave</button><button type="button" class="btn" data-act="close">Keep playing</button>`); return;
      case 'quityes': closeDlg(); leaveGame(); return;
      case 'leave': leaveGame(); return;
      case 'go': joinErr = ''; S.screen = d.v; if (d.v === 'join') parsed = null; break;
      case 'resume': S.screen = 'game'; break;
      case 'practice': startPractice(); return;
      case 'setmode': S.setup.mode = d.v; if (d.v !== 'live') S.setup.seats.forEach(s => { if (s.kind === 'remote') s.kind = 'here'; }); break;
      case 'addseat': if (S.setup.seats.length < 6) S.setup.seats.push({ name: '', kind: S.setup.mode === 'live' ? 'remote' : 'here', level: 2 }); break;
      case 'delseat': if (S.setup.seats.length > 2) S.setup.seats.splice(Number(d.i), 1); break;
      case 'start': startFromSetup(); return;
      case 'jointab': joinTab = d.v; joinErr = ''; break;
      case 'readcode': { const v = ($('#jcode') || {}).value || ''; parsed = readCode(v); joinErr = parsed.ok ? '' : parsed.err; break; }
      case 'joinmirror': {
        if (!parsed || !parsed.ok) return;
        const names = parsed.kinds.map((k, i) => k ? ROBOTS[i] : ((parsed.names[i] || '').trim() || `Player ${i + 1}`));
        undo = []; lastSaid = -1; hintOn = null;
        S.game = KF.newGame(seatsFor(names, parsed.kinds), parsed.seed);
        S.meta = { mode: 'mirror', code: mkCode(parsed.seed, parsed.kinds), kinds: parsed.kinds, names }; S.screen = 'game'; save(); break;
      }
      case 'readinvite': { const v = ($('#jlink') || {}).value || ''; startGuest(v); return; }
      case 'gmake': {
        guest.name = (($('#gname') || {}).value || '').trim();
        if (!guest.name) { guest.err = 'Type your name first.'; break; }
        guest.busy = true; guest.err = ''; render();
        try { guest.api = await NET.answer(guest.invite, guestMsg, guestState); } catch (e) { guest.err = 'This invite didn\'t work. Ask the host for a fresh invite link.'; }
        guest.busy = false; break;
      }
      case 'gcopy': copyText(guest.api.code); return;
      case 'gshare': shareText('Kite Five reply', guest.api.code); return;
      case 'invite': makeInvite(Number(d.i)).then(() => { if (dlg.open) reconnectDlg(); }); if (dlg.open) reconnectDlg(); return;
      case 'copyinv': copyText(conns[Number(d.i)].url); return;
      case 'share': shareText('Kite Five', 'Join my Kite Five game. Tap this link, then send me back the reply code:', conns[Number(d.i)].url); return;
      case 'accept': {
        const i = Number(d.i), t = (document.getElementById('rep' + i) || {}).value || '';
        await acceptReply(i, t); if (dlg.open) reconnectDlg(); return;
      }
      case 'takeover': { const i = Number(d.i); S.meta.where[i] = 'here'; if (!S.meta.names[i]) S.meta.names[i] = `Player ${i + 1}`; save(); if (dlg.open) closeDlg(); break; }
      case 'hoststart': hostStart(); return;
      case 'again': {
        undo = []; hintOn = null; lastSaid = -1;
        const seats = g.players.map(p => ({ name: p.name, kind: p.kind, level: p.level })), seed = newSeed();
        S.game = KF.newGame(seats, seed);
        if (mode() === 'mirror') { S.meta.code = mkCode(seed, S.meta.kinds); S.screen = 'mirrorcode'; }
        save(); broadcast(); break;
      }
      case 'coachok': if (S.meta) { S.meta.coach = S.meta.coach || {}; const c = coachPick(g); if (c) S.meta.coach[c.key] = true; save(); } break;
      case 'hint': { const h = KAI.hint(g); if (h) hintOn = Object.assign({ no: g.moveNo }, h); if (h) say(h.text); break; }
      case 'undo': if (undo.length) { const u = JSON.parse(undo.pop()); S.game = u.g; S.meta = u.m; hintOn = null; lastSaid = S.game.moveNo; say('Undone.'); save(); } break;
      case 'move': doAct({ t: d.v }); return;
      case 'give': doAct({ t: 'give', to: Number(d.i) }); return;
      case 'take': doAct({ t: 'take', card: d.i === 'none' ? null : Number(d.i) }); return;
      default: return;
    }
    save(); render();
  }
  function startGuest(code) {
    if (!NET.supported()) { joinErr = 'This browser cannot join live games. Try Safari or Chrome.'; S.screen = 'join'; joinTab = 'live'; render(); return; }
    if (!/[A-Za-z0-9_-]{40,}/.test(String(code))) { joinErr = 'That doesn\'t look like a whole invite. Ask the host to send it again.'; S.screen = 'join'; joinTab = 'live'; render(); return; }
    if (S.game && mode() !== 'guest') { /* keep their saved game; joining as guest doesn't overwrite it */ }
    guest = { invite: code, name: S.setup.myName || '', status: 'new' };
    S.screen = 'guestjoin'; render();
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    audio(); act(b.dataset.act, b);
  });
  document.addEventListener('input', e => {
    const t = e.target, f = t.dataset && t.dataset.field, i = Number(t.dataset.i);
    if (f === 'name') { S.setup.seats[i].name = t.value; save(); }
    else if (f === 'jname' && parsed) parsed.names[i] = t.value;
    else if (f === 'gname') { if (guest) guest.name = t.value; S.setup.myName = t.value; save(); }
  });
  document.addEventListener('change', e => {
    const t = e.target, f = t.dataset && t.dataset.field, i = Number(t.dataset.i);
    if (f === 'kind') { S.setup.seats[i].kind = t.value; save(); render(); }
    else if (f === 'level') { S.setup.seats[i].level = Number(t.value); save(); }
    else if (t.dataset && t.dataset.pref === 'sound') { S.prefs.sound = t.checked; save(); if (t.checked) sfx.keep(); }
    else if (t.dataset && t.dataset.pref === 'pace') { S.prefs.pace = t.checked ? 'fast' : 'normal'; save(); }
  });
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
  $('#menuBtn').dataset.act = 'menu';

  // opened from an invite link?
  const hm = location.hash.match(/join=([A-Za-z0-9_-]+)/);
  if (hm) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } startGuest(hm[1]); }
  else {
    if (S.game && S.screen === 'game') lastSaid = S.game.moveNo;
    if (S.screen === 'lobby' && !(S.meta && S.meta.mode === 'host')) S.screen = 'home';
    render();
  }
  window.KiteFive = { S: () => S, render, act: (a, extra) => act(a, { dataset: extra || {} }), conns, guest: () => guest, readCode, mkCode };
})();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
